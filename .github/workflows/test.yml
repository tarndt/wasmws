name: tests

on:
  pull_request:

jobs:
  build:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.5"

      - name: Install dependencies
        run: |
            go mod download

      - name: Test code
        id: test-code
        run: |
          go build ./...
          go test -shuffle=on -race ./...
